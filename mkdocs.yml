site_name: ROS 2 中文文档
site_description: ROS 2 Rolling 文档中文翻译初稿
docs_dir: source
theme:
  name: material
  language: zh
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - content.code.copy
  - search.suggest
  palette:
  - scheme: default
    toggle:
      icon: material/brightness-7
      name: 切换到深色模式
  - scheme: slate
    toggle:
      icon: material/brightness-4
      name: 切换到浅色模式
copyright: 源文档版权归 Open Robotics 及贡献者所有；沿用仓库 LICENSE。中文译文为自动翻译初稿。
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- footnotes
- def_list
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.highlight
- pymdownx.arithmatex:
    generic: true
plugins:
- search:
    lang:
    - zh
    - en
extra_javascript:
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
